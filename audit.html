<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Osano Compliance Review</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Jost:wght@500;700&family=Inter:wght@400;600&display=swap');

body { font-family:'Inter',sans-serif; background:#f6f7fb; margin:0; }
.container { max-width:950px; margin:auto; padding:30px; }

h1 { text-align:center; color:#5e2ce0; }
h2 { background:#eee9ff; padding:10px; border-left:5px solid #5e2ce0; }

.question {
  background:white;
  padding:18px;
  margin:15px 0;
  border-radius:8px;
  box-shadow:0 3px 10px rgba(0,0,0,0.08);
}
.high-risk { border-left:6px solid #f04438; }
.medium-risk { border-left:6px solid #f79009; }
.low-risk { border-left:6px solid #12b76a; }

button {
  background:#5e2ce0;
  color:white;
  padding:12px 24px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

#report { margin-top:40px; background:white; padding:25px; display:none; }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body>
<div class="container">

<h1>Osano Implementation Review</h1>

<form id="form"></form>
<button onclick="generate()">Generate Report</button>
<button id="pdfBtn" style="display:none;">Download PDF</button>

<div id="report"></div>

</div>

<script>
const checks = [
  {section:'Cookie Consent Installation',name:'inHead',label:'Is osano.js placed in the head?',risk:'high'},
  {section:'Cookie Consent Installation',name:'noAsync',label:'Is osano.js not async/deferred?',risk:'high'},
  {section:'Cookie Consent Installation',name:'republish',label:'Published in last 3 months?',risk:'medium'},
  {section:'Cookie Consent Installation',name:'strict',label:'Strict mode enabled?',risk:'high'},

  {section:'Cookie Consent Frameworks',name:'gpc',label:'GPC enabled?',risk:'high'},
  {section:'Cookie Consent Frameworks',name:'dns',label:'Do Not Sell link present?',risk:'low'},
  {section:'Cookie Consent Frameworks',name:'cookieLink',label:'Cookie preferences link present?',risk:'high'},

  {section:'DSAR & Other',name:'dsarForm',label:'DSAR form exists?',risk:'high'},
  {section:'DSAR & Other',name:'dsarRights',label:'Full rights supported?',risk:'high'}
];

const form=document.getElementById('form');

// DSAR toggle
form.innerHTML += `
<div class="question">
<strong>Is Customer Using DSAR?</strong>
<select id="dsarToggle">
<option value="">Select</option>
<option value="yes">Yes</option>
<option value="no">No</option>
</select>
</div>
`;

let current="";
checks.forEach(q=>{
  if(q.section!==current){
    form.innerHTML+=`<h2>${q.section}</h2>`;
    current=q.section;
  }

  form.innerHTML+=`
  <div class="question ${q.risk}-risk" data-section="${q.section}">
    <strong>${q.label}</strong>
    <label><input type="radio" name="${q.name}" value="yes"> Yes</label>
    <label><input type="radio" name="${q.name}" value="no"> No</label>
  </div>`;
});

// DSAR logic
document.getElementById('dsarToggle').onchange = e=>{
  document.querySelectorAll('[data-section="DSAR & Other"]').forEach(el=>{
    el.style.display = e.target.value==='yes'?'block':'none';
  });
};

function generate(){
  const report=document.getElementById('report');
  let html='<h2>Report</h2><ul>';

  checks.forEach(q=>{
    if(q.section==='DSAR & Other' && document.getElementById('dsarToggle').value!=='yes') return;
    const val=document.querySelector(`input[name="${q.name}"]:checked`);
    if(val && val.value==='no'){
      html+=`<li><b>${q.label}</b> → Needs attention</li>`;
    }
  });

  html+='</ul>';
  report.innerHTML=html;
  report.style.display='block';
  document.getElementById('pdfBtn').style.display='inline-block';
}

// PDF
document.getElementById('pdfBtn').onclick = async ()=>{
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF();

  const canvas = await html2canvas(document.getElementById('report'));
  const img = canvas.toDataURL('image/png');

  pdf.addImage(img,'PNG',10,10,180,0);
  pdf.save('report.pdf');
};
</script>

</body>
</html>
